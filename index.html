<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE GOAT — Djerba Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-olive: #232b1c;
      --bg-olive-deep: #181f13;
      --surface-olive: rgba(45, 55, 36, 0.88);
      --border-subtle: rgba(197, 155, 82, 0.28);
      --gold-wood: #c59b52;
      --gold-soft: #e3c58b;
      --wood-resto: #d4a06a;
      --copper-vivid: #c85a32;
      --copper-bright: #df6d43;
      --text-main: #f4f0e6;
      --text-muted: #c6c1b1;
      --ok-green: #529463;
      --closed-red: #b84335;
      --shadow-card: 0 12px 30px rgba(8, 12, 6, 0.42);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-olive-deep);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .marble-bg {
      position: fixed;
      inset: -15%;
      z-index: -2;
      background:
        radial-gradient(ellipse at 20% 25%, rgba(197, 155, 82, 0.12) 0%, transparent 48%),
        radial-gradient(ellipse at 80% 70%, rgba(200, 90, 50, 0.11) 0%, transparent 52%),
        radial-gradient(ellipse at 55% 15%, rgba(58, 72, 44, 0.65) 0%, transparent 60%),
        linear-gradient(135deg, #171d12 0%, #232b1c 45%, #192014 100%);
      animation: marbleDrift 22s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .marble-veins {
      position: fixed;
      inset: -10%;
      z-index: -2;
      opacity: 0.24;
      background-image:
        repeating-linear-gradient(
          118deg,
          transparent 0px,
          transparent 90px,
          rgba(197, 155, 82, 0.18) 92px,
          transparent 95px,
          transparent 210px,
          rgba(200, 90, 50, 0.14) 212px,
          transparent 215px
        );
      filter: blur(1.2px);
      animation: veinFlow 28s linear infinite alternate;
      pointer-events: none;
    }

    @keyframes marbleDrift {
      0% { transform: translate3d(-2%, -2%, 0) scale(1.02); }
      100% { transform: translate3d(2%, 2%, 0) scale(1.07); }
    }

    @keyframes veinFlow {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      100% { transform: translate3d(-2.5%, 1.5%, 0) rotate(1.5deg); }
    }

    .particles-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      bottom: -16px;
      border-radius: 50%;
      opacity: 0;
      animation: floatSpark linear infinite;
    }

    @keyframes floatSpark {
      0% { transform: translateY(0) translateX(0) scale(0.7); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.55; }
      100% { transform: translateY(-108vh) translateX(26px) scale(1.15); opacity: 0; }
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(22, 28, 17, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 11px 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .brand-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      cursor: pointer;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--gold-wood);
      background: #12160e;
      box-shadow: 0 0 14px rgba(197, 155, 82, 0.25);
    }

    .brand-name {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 1.24rem;
      letter-spacing: 0.08em;
      color: var(--gold-wood);
      line-height: 1.1;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--gold-soft);
      letter-spacing: 0.05em;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-ghost {
      background: rgba(45, 55, 36, 0.85);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    .btn-copper {
      background: var(--copper-vivid);
      color: #fff;
      box-shadow: 0 6px 18px rgba(200, 90, 50, 0.35);
    }

    .btn-copper:hover:not(:disabled) { background: var(--copper-bright); }

    .btn-gold-outline {
      background: rgba(24, 31, 19, 0.7);
      color: var(--gold-soft);
      border: 1px solid var(--gold-wood);
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 22px 18px 40px;
    }

    .hero-section {
      text-align: center;
      padding: 14px 10px 22px;
    }

    .hero-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.9rem, 5vw, 2.95rem);
      font-weight: 700;
      color: var(--gold-soft);
      letter-spacing: 0.04em;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    .hero-subtitle {
      margin-top: 8px;
      font-size: 0.96rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .pub-section { margin-bottom: 22px; }

    .pub-card {
      background: linear-gradient(125deg, rgba(200, 90, 50, 0.3), rgba(45, 55, 36, 0.9));
      border: 1.5px solid rgba(223, 109, 67, 0.65);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-card);
      flex-wrap: wrap;
    }

    .pub-tag {
      display: inline-block;
      background: var(--copper-vivid);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .pub-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .pub-desc {
      font-size: 0.87rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pub-img {
      width: 74px;
      height: 74px;
      border-radius: var(--radius-md);
      object-fit: cover;
      border: 1px solid var(--gold-wood);
    }

    .zone-selector-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }

    .zone-label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-soft);
      font-weight: 700;
    }

    .zone-tabs {
      display: inline-flex;
      gap: 8px;
      background: rgba(20, 26, 15, 0.9);
      padding: 7px;
      border-radius: 999px;
      border: 1.5px solid var(--gold-wood);
      box-shadow: var(--shadow-card);
    }

    .zone-btn {
      padding: 11px 24px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .zone-btn.active {
      background: var(--copper-vivid);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(200, 90, 50, 0.45);
    }

    .section-heading {
      font-family: 'Cinzel', serif;
      font-size: 1.18rem;
      color: var(--gold-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .restaurants-grid, .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 15px;
      margin-bottom: 24px;
    }

    .resto-card, .menu-card {
      background: var(--surface-olive);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-card);
    }

    .resto-card {
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.2s ease;
    }

    .resto-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-wood);
    }

    .resto-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .resto-name {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--wood-resto);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .badge-open {
      background: rgba(82, 148, 99, 0.24);
      color: #8ee0a3;
      border: 1px solid rgba(82, 148, 99, 0.55);
    }

    .badge-closed {
      background: rgba(184, 67, 53, 0.24);
      color: #f39b90;
      border: 1px solid rgba(184, 67, 53, 0.55);
    }

    .resto-meta, .menu-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .menu-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .menu-cat {
      font-size: 0.73rem;
      color: var(--copper-bright);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .menu-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
      text-transform: uppercase;
    }

    .menu-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
    }

    .menu-price {
      font-weight: 700;
      color: var(--gold-soft);
      font-size: 0.98rem;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--gold-wood);
      background: var(--bg-olive-deep);
      color: var(--gold-soft);
      font-weight: 700;
      cursor: pointer;
    }

    .qty-input {
      width: 48px;
      height: 30px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-olive-deep);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.88rem;
    }

    .panel {
      background: var(--surface-olive);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-card);
      margin-bottom: 24px;
    }

    .cart-summary-bar {
      background: rgba(24, 31, 19, 0.92);
      border: 1.5px solid var(--copper-bright);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-group label {
      font-size: 0.82rem;
      color: var(--gold-soft);
      font-weight: 600;
    }

    .input, textarea {
      background: rgba(20, 26, 15, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
    }

    .input:focus, textarea:focus {
      outline: none;
      border-color: var(--copper-bright);
    }

    .gps-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .gps-status {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .site-footer {
      text-align: center;
      margin-top: 26px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .feedback-msg {
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      display: none;
    }

    .feedback-msg.show { display: block; }

    .feedback-ok {
      background: rgba(82, 148, 99, 0.22);
      border: 1px solid var(--ok-green);
      color: #b7f0c5;
    }

    .feedback-err {
      background: rgba(200, 90, 50, 0.24);
      border: 1px solid var(--copper-bright);
      color: #ffd0be;
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 12px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .zone-btn {
        padding: 10px 18px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="marble-bg" aria-hidden="true"></div>
  <div class="marble-veins" aria-hidden="true"></div>
  <div class="particles-layer" id="particlesLayer" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-stack" id="brandHomeBtn">
        <img src="./logo.png" alt="Logo THE GOAT" class="brand-logo" />
        <div class="brand-name">THE GOAT</div>
        <div class="brand-sub">DJERBA DELIVERY</div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1 class="hero-title">MORE THAN JUST FOOD</h1>
      <p class="hero-subtitle">Vos restaurants préférés livrés rapidement à Djerba</p>
    </section>

    <section class="pub-section" id="pubSection" aria-label="Offres et publicités"></section>

    <div class="zone-selector-wrap" id="zoneSelectorWrap">
      <div class="zone-label">Choisissez votre zone</div>
      <div class="zone-tabs" role="tablist" aria-label="Zones de livraison">
        <button class="zone-btn active" data-zone="Ajim" id="zoneAjim" type="button">
          AJIM
        </button>
        <button class="zone-btn" data-zone="Houmt Souk" id="zoneHoumtSouk" type="button">
          HOUMT SOUK
        </button>
      </div>
    </div>

    <div id="orderFlow">
      <section id="stepRestaurants">
        <div id="restaurantsBlock">
          <div class="section-heading">
            <span id="restaurantsHeading">RESTAURANTS — AJIM</span>
            <button class="btn btn-gold-outline" id="reloadDataBtn" type="button">ACTUALISER</button>
          </div>
          <div class="restaurants-grid" id="restaurantsGrid"></div>
        </div>

        <div id="cafesBlock" class="hidden">
          <div class="section-heading">
            <span id="cafesHeading">CAFÉS — AJIM</span>
          </div>
          <div class="restaurants-grid" id="cafesGrid"></div>
        </div>
      </section>

      <section id="stepMenu" class="hidden">
        <div class="section-heading">
          <div>
            <button class="btn btn-ghost" id="backToRestaurantsBtn" type="button" style="margin-right: 10px;">
              ← RESTAURANTS
            </button>
            <span id="menuHeading">MENU</span>
          </div>
        </div>

        <div class="menu-grid" id="menuGrid"></div>

        <div class="cart-summary-bar">
          <div>
            <div style="font-size: 0.82rem; color: var(--text-muted);" id="step2SummaryCount">0 ARTICLE(S) DANS LE PANIER</div>
            <div style="font-weight: 700; color: var(--gold-soft); font-size: 1.04rem;" id="step2SummaryTotal">0.000 TND</div>
          </div>
          <button class="btn btn-copper" id="confirmCartBtn" type="button">
            CONTINUER VERS LA LIVRAISON →
          </button>
        </div>
        <div class="feedback-msg" id="menuFeedback"></div>
      </section>

      <section id="stepCheckout" class="panel hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;">
          <h2 style="font-family: 'Cinzel', serif; color: var(--gold-soft); font-size: 1.12rem; text-transform: uppercase;">
            LIVRAISON, GPS &amp; VALIDATION
          </h2>
          <button class="btn btn-ghost" id="backToMenuBtn" type="button">
            ← RETOUR AU MENU
          </button>
        </div>

        <form id="orderForm" style="margin-top: 16px;">
          <div class="form-grid">
            <div class="input-group">
              <label for="clientName">Nom complet *</label>
              <input class="input" id="clientName" name="clientName" type="text" required placeholder="Votre nom" />
            </div>
            <div class="input-group">
              <label for="clientPhone">Téléphone *</label>
              <input class="input" id="client
