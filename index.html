<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the goat — livraison djerba</title>
  <style>
    :root {
      --bg-olive: #141a13;
      --bg-card: #1d261b;
      --bg-elevated: #263224;
      --gold: #d4af37;
      --copper: #c87d55;
      --copper-dark: #9e5d3b;
      --text-main: #f3efe6;
      --text-muted: #b7b2a3;
      --border-subtle: rgba(212, 175, 55, 0.22);
      --ok: #5cb85c;
      --warn: #e09f3e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #1f2a1d 0%, var(--bg-olive) 65%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.45;
      padding-bottom: 96px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .brand_box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand_badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--copper));
      color: #121711;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: lowercase;
    }

    .brand_title {
      font-size: 20px;
      font-weight: 700;
      color: var(--gold);
      text-transform: lowercase;
    }

    .brand_sub {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: lowercase;
    }

    .zone_controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .zone_btn, .nav_btn, .btn_primary, .btn_secondary {
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      text-transform: lowercase;
    }

    .zone_btn {
      background: var(--bg-elevated);
      color: var(--text-main);
    }

    .zone_btn.active {
      background: linear-gradient(135deg, var(--gold), var(--copper));
      color: #141a13;
      border-color: var(--gold);
    }

    .nav_tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .nav_btn {
      background: var(--bg-card);
      color: var(--text-muted);
    }

    .nav_btn.active {
      background: var(--bg-elevated);
      color: var(--gold);
      border-color: var(--gold);
    }

    .pub_banner {
      display: none;
      background: linear-gradient(90deg, rgba(200, 125, 85, 0.22), rgba(212, 175, 55, 0.18));
      border: 1px solid var(--copper);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
      align-items: center;
      gap: 12px;
    }

    .pub_banner.show {
      display: flex;
    }

    .pub_banner img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--gold);
    }

    .section_title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
      text-transform: lowercase;
    }

    .grid_cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .card_banner {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      background: var(--bg-elevated);
    }

    .card_header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card_logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
    }

    .card_name {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
    }

    .card_meta {
      font-size: 12px;
      color: var(--copper);
      text-transform: lowercase;
    }

    .card_desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card_footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }

    .price_tag {
      font-weight: 700;
      color: var(--gold);
      font-size: 14px;
    }

    .btn_primary {
      background: linear-gradient(135deg, var(--gold), var(--copper));
      color: #141a13;
      border: none;
    }

    .btn_secondary {
      background: var(--bg-elevated);
      color: var(--text-main);
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .form_grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: lowercase;
    }

    .field input, .field textarea, .field select {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 11px;
      color: var(--text-main);
      font-size: 13px;
      width: 100%;
    }

    .cart_item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }

    .qty_box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var
